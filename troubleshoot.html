<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No Internet Troubleshooter</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="index.html"><span class="sun" aria-hidden="true"></span>Northlight Studio</a>
      <nav aria-label="Main">
        <ul>
          <li><a href="index.html#services">Services</a></li>
          <li><a href="index.html#faq">FAQ</a></li>
          <li><a href="index.html#contact">Contact</a></li>
          <li><a href="helpdesk.html">Help Desk</a></li>
          <li><a href="troubleshoot.html" aria-current="page">Troubleshoot</a></li>
          <li><a href="staff.html">Staff</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <div class="page-head">
    <div class="wrap">
      <h1>No internet? Let's find out why</h1>
      <p>Answer a few questions. This guide only suggests steps and changes nothing.</p>
    </div>
  </div>
  <main class="wrap page-body narrow">
    <div class="card" id="card" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>Northlight Studio. A demo site with fake data.</span>
      <span><a href="index.html">Home</a> · <a href="helpdesk.html">Help Desk</a> · <a href="troubleshoot.html">Troubleshoot</a> · <a href="staff.html">Staff access</a></span>
    </div>
  </footer>

  <script>
    // Decision tree: each node is a question (options) or a result (fix / escalate).
    const TREE = {
      start: { q: 'Do other devices (a phone or another computer) on the same network have internet?',
        help: 'Try a phone on the same Wi-Fi, or another computer on the same cable.',
        options: [
          { label: 'Yes, only this computer has no internet', next: 'pcWifi' },
          { label: 'No, nothing has internet', next: 'routerLights' },
          { label: 'I cannot check right now', next: 'pcWifi' } ] },

      // ----- Only this computer -----
      pcWifi: { q: 'Is Airplane mode on, or is Wi-Fi switched off (or the network cable unplugged)?',
        options: [
          { label: 'Yes, that was it', next: 'fixSwitch' },
          { label: 'No, Wi-Fi or cable looks connected', next: 'pcVpn' } ] },
      pcVpn: { q: 'Are you using a VPN or proxy?',
        options: [
          { label: 'Yes', next: 'pcVpnOff' },
          { label: 'No', next: 'pcIp' } ] },
      pcVpnOff: { q: 'Disconnect the VPN or proxy and try a website again. Did it work?',
        options: [
          { label: 'Yes, the website loads', next: 'fixVpn' },
          { label: 'No, still nothing', next: 'pcIp' } ] },
      pcIp: { q: 'Open http://1.1.1.1 in your browser. Does a page appear?',
        help: 'This tests the internet connection without needing website names (DNS).',
        options: [
          { label: 'Yes, the page opens', next: 'fixDns' },
          { label: 'No, it does not open', next: 'pcRestart' } ] },
      pcRestart: { q: 'Restart this computer, wait a minute and try again. Did it fix it?',
        options: [
          { label: 'Yes', next: 'fixRestart' },
          { label: 'No', next: 'escalateTool' } ] },

      // ----- Nothing has internet -----
      routerLights: { q: 'Are the lights on your router (or modem) on?',
        options: [
          { label: 'No, the router has no lights', next: 'fixPower' },
          { label: 'Yes, lights are on', next: 'routerWan' } ] },
      routerWan: { q: 'Is the internet / WAN light off, red or blinking in an unusual way?',
        help: 'Check your router manual or label if you are not sure which light is the internet light.',
        options: [
          { label: 'Yes, the internet light is off or red', next: 'routerCable' },
          { label: 'No, it looks normal', next: 'routerRestart' } ] },
      routerCable: { q: 'Check that the cable from the wall or modem into the router is firmly plugged in at both ends. Is it now working?',
        options: [
          { label: 'Yes', next: 'fixCable' },
          { label: 'No', next: 'routerRestart' } ] },
      routerRestart: { q: 'Switch the router off at the power, wait 30 seconds, switch it on and wait 3 minutes. Is the internet back?',
        options: [
          { label: 'Yes', next: 'fixRouterRestart' },
          { label: 'No', next: 'escalateIsp' } ] },

      // ----- Results -----
      fixSwitch: { result: 'fix', title: 'Turn the connection back on', text: 'Switch off Airplane mode, turn Wi-Fi on or plug the cable back in, then try a website again.' },
      fixVpn: { result: 'fix', title: 'The VPN or proxy was blocking you', text: 'Leave it off for now. If you need it, check its settings or ask whoever manages it.' },
      fixDns: { result: 'fix', title: 'Probably a DNS problem', text: 'The internet works but website names do not. Restarting the router often fixes it. If it keeps happening, ask your IT contact about the DNS server setting. Run the network doctor below to confirm.', tool: true },
      fixRestart: { result: 'fix', title: 'Fixed by restarting', text: 'The connection was stuck. If it happens often, note when it does and tell your IT contact.' },
      fixPower: { result: 'fix', title: 'The router has no power', text: 'Check the power cable and socket, and try another socket. If it still has no lights, the router may be broken.' },
      fixCable: { result: 'fix', title: 'A loose cable was the cause', text: 'Leave the cable firmly plugged in. If it drops again, the cable may need replacing.' },
      fixRouterRestart: { result: 'fix', title: 'Fixed by restarting the router', text: 'The router had stalled. If it needs this often, ask your provider to check the line.' },
      escalateTool: { result: 'escalate', title: 'Run the network doctor', text: 'Open a terminal in the project folder and run the command below. It checks the router, then 1.1.1.1, then a website name, and tells you the first step that fails. Send that result to your IT contact.', tool: true },
      escalateIsp: { result: 'escalate', title: 'Contact your internet provider', text: 'Your router looks fine but there is no internet, so the problem is probably on the provider\'s side. Check their status page or phone them, and tell them you already restarted the router.' }
    };

    const card = document.getElementById('card');
    let path = ['start']; // history of node ids; last is current

    function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

    function render() {
      const id = path[path.length - 1];
      const node = TREE[id];
      card.replaceChildren();
      card.className = 'card' + (node.result ? ' result' + (node.result === 'escalate' ? ' escalate' : '') : '');
      card.append(el('p', 'trail', 'Step ' + path.length));

      if (node.result) {
        card.append(el('span', 'tag', node.result === 'fix' ? 'Likely fix' : 'Next step'));
        card.append(el('h2', null, node.title), el('p', 'help', node.text));
        if (node.tool) { const p = el('p'); p.append(el('code', null, 'node tools/network-doctor.js')); card.append(p); }
      } else {
        card.append(el('h2', null, node.q));
        if (node.help) card.append(el('p', 'help', node.help));
        const opts = el('div', 'options');
        node.options.forEach(o => {
          const b = el('button', null, o.label);
          b.type = 'button';
          b.addEventListener('click', () => { path.push(o.next); render(); });
          opts.append(b);
        });
        card.append(opts);
      }

      const nav = el('div', 'nav');
      if (path.length > 1) {
        const back = el('button', null, 'Back'); back.type = 'button';
        back.addEventListener('click', () => { path.pop(); render(); });
        nav.append(back);
        const again = el('button', node.result ? 'primary' : null, 'Start over'); again.type = 'button';
        again.addEventListener('click', () => { path = ['start']; render(); });
        nav.append(again);
      }
      card.append(nav);
      const h = card.querySelector('h2'); h.tabIndex = -1; h.focus();
    }
    render();
  </script>
</body>
</html>
